[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-scout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.28.2",
    "lxml==6.0.3",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "Pillow==11.3.0",
    "pytesseract==0.3.13",
    "opencv-python==4.10.0.84",
    "numpy>=1.26",
    "presidio-analyzer==2.2.366",
    "spacy==3.8.14",
    "pdqhash==0.2.8",
    "httpx==0.28.1",
    "beautifulsoup4==4.14.3",
    "playwright==1.62.0",
    "PyYAML>=6",
    "anthropic==1.17.0",
    "streamlit==1.56.0",
    "detect-secrets==1.5.0",
    "bandit==1.9.4",
    "fastapi==0.136.3",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio>=0.24",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shield*"]

[project.scripts]
shield = "shield.codescan.main:main"
